server:
  port: 8080

spring:
  application:
    name: Order Management System

  datasource:
    url: jdbc:h2:mem:omsdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: simple

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    display-operation-id: true
  info:
    title: "Intelligent Order Management System API"
    description: "智能訂單管理系統 REST API 文檔"
    version: "v1.0.0"

jwt:
  secret: ${JWT_SECRET:dev-only-secret-DO-NOT-USE-IN-PRODUCTION-please-set-JWT_SECRET-env-var}
  expiration: ${JWT_EXPIRATION:3600000} # 1 hour (default), configurable via JWT_EXPIRATION env var

langchain4j:
  ollama:
    base-url: http://localhost:11434
    model-name: qwen2.5:14b
    timeout: 60s

cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true